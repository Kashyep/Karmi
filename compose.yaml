services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: daily_agent_test
      POSTGRES_USER: daily_agent_test
      POSTGRES_PASSWORD: daily_agent_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_agent_test -d daily_agent_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

