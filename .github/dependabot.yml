version: 2

updates:
  # Python: version updates are disabled on purpose. requirements.lock is generated by
  # `uv pip compile` (CLAUDE.md) and CI fails when it drifts from pyproject.toml, so a
  # Dependabot version bump would arrive red. Security updates still open PRs (they are
  # enabled per repository, not in this file); they need the lock regenerated by hand.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pub
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: "/mobile/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
