name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# A new push to a PR branch cancels the superseded run. Runs for pushes to main
# are never cancelled, so every commit that lands on main gets a full CI result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # Measured: max of last 5 successful runs ~168 s (2.8 min); 2x, rounded up to 6.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Lock matches pyproject
        run: |
          pip install uv==0.12.17
          cp requirements.lock /tmp/requirements.lock
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 -q -o /tmp/requirements.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock) || { echo 'requirements.lock is stale: regenerate it (see CLAUDE.md)'; exit 1; }
      - name: Install dependencies
        run: pip install -c requirements.lock -e '.[dev]'
      - name: Lint
        run: python scripts/tasks.py lint
      - name: Typecheck
        run: python scripts/tasks.py typecheck
      - name: Unit tests
        run: python scripts/tasks.py test-unit
      - name: E2E tests
        run: python scripts/tasks.py test-e2e
      - name: Benchmark demo
        run: python scripts/tasks.py benchmark-demo
      - name: Integration tests (disposable Postgres/Redis)
        run: python scripts/tasks.py test-integration

  mobile-checks:
    runs-on: ubuntu-latest
    # Measured: max of last 5 successful runs ~672 s (11.2 min); 2x, rounded up to 23.
    timeout-minutes: 23
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          # Caches the Flutter SDK and the pub cache; the pub cache key hashes **/pubspec.lock.
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --exclude-tags golden
      - name: Goldens (baselines in test/goldens/linux)
        # The Usage screen shows the reset time in local time; baselines were rendered in IST.
        env:
          TZ: Asia/Kolkata
        run: flutter test --tags golden
      - name: Build Android app bundle
        run: flutter build appbundle --release

  mobile-ios-build:
    runs-on: macos-latest
    # Measured: max of last 5 successful runs ~334 s (5.6 min); 2x, rounded up to 12.
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ipa --release --no-codesign
