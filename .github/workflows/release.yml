name: release

# Tag push (v*) builds the release artifacts and creates a DRAFT GitHub release.
# workflow_dispatch is a dry run: artifacts are built and kept as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve and check version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          full=$(grep -m1 '^version:' mobile/pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          re='^([0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)(\.[0-9]+)?)?)\+([0-9]+)$'
          if [[ ! "$full" =~ $re ]]; then
            echo "::error::mobile/pubspec.yaml version '$full' is not X.Y.Z[-beta|-rc[.N]]+BUILD"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[5]}"
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::push event is not a tag"
              exit 1
            fi
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag '$REF_NAME' does not match pubspec version '$version' (tag must be v$version)"
              exit 1
            fi
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notes"
          python3 scripts/release/make_altstore_source.py notes \
            --changelog CHANGELOG.md --version "$VERSION" --output "$RUNNER_TEMP/notes/notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.signing.outputs.available }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: "stable"
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --exclude-tags golden
      - name: Goldens
        env:
          TZ: Asia/Kolkata
        run: flutter test --tags golden
      - name: Check Android signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android APK skipped::One or more of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD is not set. No APK is built or uploaded (a release is never debug-signed); build and upload the signed APK manually."
          fi
      - name: Write signing config
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          ks="$RUNNER_TEMP/karmi-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          # java.util.Properties treats backslash as an escape character.
          esc() { local v="$1"; printf '%s' "${v//\\/\\\\}"; }
          {
            printf 'storePassword=%s\n' "$(esc "$KEYSTORE_PASSWORD")"
            printf 'keyPassword=%s\n' "$(esc "$KEY_PASSWORD")"
            printf 'keyAlias=%s\n' "$(esc "$KEY_ALIAS")"
            printf 'storeFile=%s\n' "$(esc "$ks")"
          } > android/key.properties
      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # build.gradle.kts debug-signs a release build when CI=true and key.properties is missing.
          test -f android/key.properties
          flutter build apk --release
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/karmi-$VERSION.apk"
      - name: Verify signature is the release key, never the debug key
        if: steps.signing.outputs.available == 'true'
        id: verify
        env:
          VERSION: ${{ needs.version.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/out/karmi-$VERSION.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if [ "$(grep -c 'certificate SHA-256 digest' <<<"$certs")" != "1" ]; then
            echo "::error::expected exactly one signer"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' <<<"$certs"; then
            echo "::error::APK is signed with the Android debug certificate"
            exit 1
          fi
          apk_cert=$(sed -n 's/.*certificate SHA-256 digest: *//p' <<<"$certs" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          ks_cert=$(keytool -list -v -keystore "$RUNNER_TEMP/karmi-release.jks" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: *//p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          if [ -z "$apk_cert" ] || [ "$apk_cert" != "$ks_cert" ]; then
            echo "::error::APK signing certificate does not match the release keystore"
            exit 1
          fi
          apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "cert_sha256=$apk_cert" >> "$GITHUB_OUTPUT"
          {
            echo "### Android APK"
            echo "- file: karmi-$VERSION.apk"
            echo "- SHA-256: $apk_sha"
            echo "- signing certificate SHA-256: $apk_cert"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/karmi-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.signing.outputs.available == 'true'
        with:
          name: android
          path: ${{ runner.temp }}/out/karmi-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: "stable"
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          plist="$app/Info.plist"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          bnum=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          if [ "$bundle" != "ai.karmi.app" ] || [ "$short" != "$VERSION" ] || [ "$bnum" != "$BUILD" ]; then
            echo "::error::Info.plist mismatch: id=$bundle version=$short build=$bnum (expected ai.karmi.app $VERSION $BUILD)"
            exit 1
          fi
          work=$(mktemp -d)
          out="$RUNNER_TEMP/out"
          mkdir -p "$work/Payload" "$out"
          cp -R "$app" "$work/Payload/"
          (cd "$work" && zip -qry "$out/karmi-$VERSION.ipa" Payload)
          sha=$(shasum -a 256 "$out/karmi-$VERSION.ipa" | cut -d' ' -f1)
          {
            echo "### iOS IPA (unsigned, experimental, untested on device)"
            echo "- file: karmi-$VERSION.ipa"
            echo "- SHA-256: $sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios
          path: ${{ runner.temp }}/out/karmi-${{ needs.version.outputs.version }}.ipa
          if-no-files-found: error

  source:
    needs: [version, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
          path: ${{ runner.temp }}/in
      - name: Generate source.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 scripts/release/make_altstore_source.py source \
            --version "$VERSION" --build "$BUILD" --tag "$TAG" \
            --ipa "$RUNNER_TEMP/in/karmi-$VERSION.ipa" \
            --notes "$RUNNER_TEMP/in/notes.md" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
            --output "$RUNNER_TEMP/out/source.json"
          cat "$RUNNER_TEMP/out/source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: ${{ runner.temp }}/out/source.json
          if-no-files-found: error

  publish:
    needs: [version, android, ios, source]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          APK_BUILT: ${{ needs.android.outputs.built }}
          APK_CERT_SHA256: ${{ needs.android.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          cd dist
          test -s "karmi-$VERSION.ipa"
          test -s source.json
          test -s notes.md
          files=("karmi-$VERSION.ipa" source.json)
          {
            echo
            echo "---"
            echo "iOS: experimental, untested on device. Unsigned IPA for SideStore/AltStore/Sideloadly."
            if [ "$APK_BUILT" = "true" ]; then
              test -s "karmi-$VERSION.apk"
              files=("karmi-$VERSION.apk" "${files[@]}")
              echo "Android signing certificate SHA-256: \`$APK_CERT_SHA256\`"
            else
              echo "Android APK: not attached (CI signing secrets were not configured)."
            fi
          } >> notes.md
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          args=(--draft --verify-tag --title "Karmi $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" "${files[@]}" SHA256SUMS.txt
