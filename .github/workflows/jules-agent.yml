name: Daily Codebase Maintenance & Security Agent

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering from the GitHub Actions UI

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Jules Agent
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            You are a comprehensive autonomous codebase agent. Scan the entire repository for issues, propose improvements, and fix them. Your responsibilities include:
            
            1. Security: Identify and fix hardcoded secrets, API keys, passwords, SQL injection, and command injection vulnerabilities.
            2. Code Quality: Refactor brittle code, remove dead code, improve type safety, and ensure adherence to best practices.
            3. Performance: Address database lock contention, inefficient algorithmic paths, and scalability bottlenecks (like the platform budget hot-row).
            4. Reliability: Fix race conditions and ensure transactional invariants are maintained.
            5. Testing: Identify missing test coverage and write unit tests for unhandled edge cases.
            
            Do not just report issues—actively apply fixes and improvements to the codebase.
