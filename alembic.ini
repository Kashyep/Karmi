[alembic]
script_location = migrations
prepend_sys_path = src
# NOTE: migrations/env.py ignores this value and builds the URL from a fresh
# Settings() — set DAILY_AGENT_DATABASE_URL. This line is a placeholder only.
sqlalchemy.url = sqlite+pysqlite:///./data/development.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

